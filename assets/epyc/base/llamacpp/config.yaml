# Layer 2 config for the llama.cpp/EPYC named base (LLAMACPP_FULL_PROJECT_CHANGES.md
# Group 5) — resolve_base_assets_dir() (src/aim_utils/specialized_utils.py) finds
# this dir by its own config.yaml and ships its config/engines.yaml +
# profiles/general/ into docker/Dockerfile.aim-epyc-base instead of the shared
# (vLLM) assets/epyc/base/config directory.
#
# base_image here is the Layer 1 image built from
# assets/epyc/engines/llamacpp/image/Dockerfile. base_repository name
# (aim-epyc-specialized-llamacpp) is the canonical name
# enumerate_specialized_base_targets() computes for this target
# (_layer1_image_name -> get_model_image_name(..., "specialized-llamacpp",
# ...)) — verified via a local import, not guessed. Placeholder registry
# namespace/tag — fill in with wherever Layer 1 actually got pushed (or built
# and tagged locally for a same-host build chain).
base_image:
  base_registry_namespace: stpauljackson3
  base_repository: aim-epyc-specialized-llamacpp
  base_tag: "0.1.0"
  registry_host: docker.io
