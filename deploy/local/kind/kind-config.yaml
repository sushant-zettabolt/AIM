# Node-level CPU reservation split, out of this host's 16 cores:
#   2  -> system-reserved (OS-level daemons: containerd, sshd, udev, etc.)
#   2  -> kube-reserved   (Kubernetes' own components: kubelet, kube-proxy)
#   12 -> left as Allocatable, i.e. what pods can actually request/use
#
# Both are kubelet-level settings applied at node init via a kubeadm
# KubeletConfiguration patch — there's no way to set this from a Deployment
# manifest, and it can't be changed on a running node, hence a separate
# config file passed to `kind create cluster --config`.
#
# Kubernetes computes Allocatable = Capacity - kube-reserved - system-reserved
# (minus an eviction-hard threshold, negligible for cpu). Verify after
# creating the cluster with:
#   kubectl describe node aim-local-control-plane | grep -A6 Allocatable:
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aim-local
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        systemReserved:
          cpu: "2"
          memory: "1Gi"
        kubeReserved:
          cpu: "2"
          memory: "1Gi"
