# Throwaway local artifact — see 00-namespace.yaml for context.
#
# Image: aim-llamacpp-smoketest (built by the local Docker smoke test, see
# /tmp/.../scratchpad/docker-smoketest/Dockerfile from that session) — a
# single-stage image, NOT the real 3-layer production pattern
# (docker/Dockerfile.aim-epyc-base + docker/Dockerfile.aim on top of a
# compiled-for-EPYC engine image). Sideloaded into the kind node with
# `kind load docker-image aim-llamacpp-smoketest --name aim-local`, so
# imagePullPolicy is Never — there is no registry involved.
#
# AIM_ID / AIM_ENGINE are already baked into the image as defaults; set
# explicitly here anyway so the Deployment is self-describing.
#
# The image doesn't bake the GGUF in or mount it from the host — it downloads
# via llama-server's own `-hf` flag at container startup (same as the bare
# container smoke test), so the pod needs outbound network access to
# huggingface.co. That's why startupProbe is generous: download + model load
# can take a couple of minutes depending on network conditions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aim-llamacpp
  namespace: aim-demo
  labels:
    app: aim-llamacpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aim-llamacpp
  template:
    metadata:
      labels:
        app: aim-llamacpp
    spec:
      containers:
        - name: aim-llamacpp
          image: aim-llamacpp-smoketest
          imagePullPolicy: Never
          env:
            - name: AIM_ID
              value: "aim-smoketest/llamacpp-tiny"
            - name: AIM_ENGINE
              value: "llamacpp"
            # Profile default ctx-size (2048) was too small for OpenWebUI's
            # requests, which add title-generation/tagging overhead on top of
            # the visible chat — hit "request (5812 tokens) exceeds context
            # size" in practice. AIM_ENGINE_ARGS overrides profile.yaml's
            # engine_args at container-start with no image rebuild needed
            # (src/aim_runtime/config.py's engine_args_override merge). 8192
            # matches this model's n_ctx_train, so it's the real ceiling.
            # threads matches this pod's cpu request/limit (10) below —
            # llama-server would otherwise default to detecting all 16 host
            # cores and oversubscribe against the cgroup's actual quota.
            #
            # Not 12: the node's Allocatable is 12 (16 - 2 system-reserved -
            # 2 kube-reserved, see kind/kind-config.yaml), but on this
            # SINGLE-NODE kind cluster the one node is also the control
            # plane, so etcd/kube-apiserver/coredns/kube-proxy/etc. are
            # themselves pods scheduled here, already requesting ~1.2 cores
            # out of that 12 (`kubectl describe node` -> Allocated
            # resources). Requesting the full 12 for this pod left zero
            # room and the pod sat Pending ("Insufficient cpu"). 10 leaves
            # headroom for those plus the UI pod. A real multi-node cluster
            # wouldn't have this issue — control-plane runs on separate
            # master nodes there, not sharing this node's Allocatable.
            - name: AIM_ENGINE_ARGS
              value: '{"ctx-size": 8192, "threads": 10}'
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "10"
              memory: "1Gi"
            limits:
              cpu: "10"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 120  # ~10 min ceiling for GGUF download + model load on a slow link
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
