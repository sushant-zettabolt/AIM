{{ define "aimchart-llm.deployment.bare" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aimchart-llm.release.fullname" . }}
  labels:
    app: {{ include "aimchart-llm.release.fullname" . }}
    {{- range $key, $value := .Values.metadata.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ include "aimchart-llm.release.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "aimchart-llm.release.fullname" . }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.modelCacheInit.enabled }}
      initContainers:
        # Runs `./entrypoint.py download-to-cache` (same image, same env, so it
        # resolves the identical profile/model the main container will
        # select) before the main container starts, into the shared
        # ephemeral-storage volume. Needed for engines whose model-cache
        # resolution requires the model already on disk rather than
        # downloading it themselves at launch (e.g. llamacpp — see
        # src/aim_runtime/engines/llamacpp.py's resolve_model_path). Set
        # AIM_CACHE_PATH (in env_vars) to a path under /workload so the
        # download lands on this same mounted volume, not the container's
        # own writable layer.
        - name: model-cache-init
          image: {{ .Values.image | quote }}
          # Same policy as the main container: both run the identical image,
          # so letting them diverge means the init container can start from
          # cache while the main container fails its pull -- which is
          # exactly the split seen when this was hardcoded.
          imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" | quote }}
          command: ["./entrypoint.py", "download-to-cache"]
          {{- if .Values.env_vars }}
          env:
            {{- include "aimchart-llm.container.env" . | nindent 12 }}
          {{- end }}
          # Without this, the init container has no requests/limits at all,
          # which makes the *whole pod* QoS Burstable regardless of the main
          # container's own requests==limits -- kubelet computes pod QoS
          # across every container, init included. Burstable pods never get
          # an exclusive cpuset from the static CPU Manager policy, only
          # Guaranteed ones do, so this was silently defeating pinning.
          # Reusing the main container's own resources is safe: init and
          # main containers never run concurrently, so this doesn't add to
          # the pod's real concurrent footprint, just matches its QoS class.
          resources:
            {{- include "aimchart-llm.container.resources" . | nindent 12 }}
          volumeMounts:
            {{- include "aimchart-llm.container.volumeMounts" . | nindent 12 }}
      {{- end }}
      containers:
        - name: aim-llm
          {{- if .Values.env_vars }}
          env:
            {{- include "aimchart-llm.container.env" . | nindent 12 }}
          {{- end }}
          image: {{ .Values.image | quote }}
          # Was hardcoded "Always", which forces a registry round-trip on
          # every pod start even for an immutable pinned tag already on the
          # node. On a restart loop that burns anonymous Docker Hub pulls
          # fast -- observed as `429 Too Many Requests` from
          # registry-1.docker.io on the nested-K8s smoke test, while the
          # init container (no explicit policy, so IfNotPresent for a
          # non-:latest tag) started fine from the cached image in the same
          # pod. Default is unchanged; set imagePullPolicy: IfNotPresent to
          # opt out when the tag is pinned.
          imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" | quote }}
          {{- if .Values.cpuAffinity }}
          # Overrides the image's default ENTRYPOINT invocation (./entrypoint.py
          # with no args, which its click.group(invoke_without_command=True)
          # defaults to the `serve` subcommand) with a taskset wrapper. serve()
          # launches llama-server via os.execv -- process-image replacement, not
          # fork+exec (aim_runtime.py's serve()) -- so the affinity mask taskset
          # sets here survives the execv unchanged and pins llama-server itself,
          # not just the short-lived Python process in front of it.
          command: ["taskset", "-c", {{ .Values.cpuAffinity | quote }}, "./entrypoint.py"]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ default 8000 .Values.env_vars.AIM_PORT }}
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            failureThreshold: 360 # 360 x 10s => allow for 60 minutes startup time
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
          resources:
            {{- include "aimchart-llm.container.resources" . | nindent 12 }}
          volumeMounts:
            {{- include "aimchart-llm.container.volumeMounts" . | nindent 12 }}
      volumes:
  {{- include "aimchart-llm.container.volumes" . | nindent 8 }}
{{- end -}}

{{ define "aimchart-llm.deployment.instance" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .baseName }}-{{ .instance.name }}
  labels:
    app: {{ .baseName }}
    instance: {{ .instance.name | quote }}
    {{- range $key, $value := .Values.metadata.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  # Always 1 -- an instance entry describes one pinned pod occupying one
  # specific core range; replicas > 1 here would put two pods on the exact
  # same cpuAffinity, defeating the whole point of pinning. `app` is shared
  # across every instance (unlike deployment.bare's fullname-derived label)
  # so the chart's one Service (service.yml, unmodified) load-balances
  # across all N pinned pods automatically; `instance` makes each
  # Deployment's own selector unique so Kubernetes doesn't reject them as
  # overlapping.
  replicas: 1
  selector:
    matchLabels:
      app: {{ .baseName }}
      instance: {{ .instance.name | quote }}
  template:
    metadata:
      labels:
        app: {{ .baseName }}
        instance: {{ .instance.name | quote }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.modelCacheInit.enabled }}
      initContainers:
        # Same shared model-cache-init as deployment.bare -- see that
        # block's comments. All N instances mount the SAME PVC/ConfigMap
        # (both named from the base fullname, untouched by the instances
        # loop), so the model is downloaded once, not once per instance.
        - name: model-cache-init
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" | quote }}
          command: ["./entrypoint.py", "download-to-cache"]
          {{- if .Values.env_vars }}
          env:
            {{- include "aimchart-llm.container.env" . | nindent 12 }}
          {{- end }}
          resources:
            {{- include "aimchart-llm.container.resources" . | nindent 12 }}
          volumeMounts:
            {{- include "aimchart-llm.container.volumeMounts" . | nindent 12 }}
      {{- end }}
      containers:
        - name: aim-llm
          {{- if .Values.env_vars }}
          env:
            {{- include "aimchart-llm.container.env" . | nindent 12 }}
          {{- end }}
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "Always" | quote }}
          {{- if .instance.cpuAffinity }}
          # Same taskset-wrapping mechanism as deployment.bare's single-
          # cpuAffinity case (see that block's comment for why the affinity
          # mask survives into llama-server itself via os.execv) -- just
          # sourced per-entry from .instance.cpuAffinity instead of a single
          # top-level .Values.cpuAffinity.
          command: ["taskset", "-c", {{ .instance.cpuAffinity | quote }}, "./entrypoint.py"]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ default 8000 .Values.env_vars.AIM_PORT }}
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            failureThreshold: 360 # 360 x 10s => allow for 60 minutes startup time
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
          resources:
            {{- include "aimchart-llm.container.resources" . | nindent 12 }}
          volumeMounts:
            {{- include "aimchart-llm.container.volumeMounts" . | nindent 12 }}
      volumes:
  {{- include "aimchart-llm.container.volumes" . | nindent 8 }}
{{- end -}}

{{ define "aimchart-llm.deployment.kaiwoservice" -}}
apiVersion: kaiwo.silogen.ai/v1alpha1
kind: KaiwoService
metadata:
  name: {{ include "aimchart-llm.release.fullname" . }}
  labels:
    app: {{ include "aimchart-llm.release.fullname" . }}
    {{- range $key, $value := .Values.metadata.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  deployment:
    {{- include "aimchart-llm.deployment.bare" . | nindent 4 }}
{{- end }}

{{- $pv := include "aimchart-llm.platformValues" . | fromYaml -}}
{{- $ctx := merge (dict "Values" $pv) (omit . "Values") -}}
{{- with $ctx -}}

{{- if .Values.instances }}
{{- $baseName := include "aimchart-llm.release.fullname" . -}}
{{- $root := . -}}
{{- range $inst := .Values.instances }}
{{- $ictx := merge (dict "baseName" $baseName "instance" $inst) $root -}}
{{- include "aimchart-llm.deployment.instance" $ictx }}
---
{{- end }}
{{- else if not .Values.existingService -}}
{{- if .Values.kaiwo.enabled -}}
{{- include "aimchart-llm.deployment.kaiwoservice" . }}
{{- else -}}
{{- include "aimchart-llm.deployment.bare" . }}
{{- end }}
{{- end }}

{{- end -}}
