{{ define "aimchart-llm.deployment.bare" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aimchart-llm.release.fullname" . }}
  labels:
    app: {{ include "aimchart-llm.release.fullname" . }}
    {{- range $key, $value := .Values.metadata.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ include "aimchart-llm.release.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "aimchart-llm.release.fullname" . }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.modelCacheInit.enabled }}
      initContainers:
        # Runs `./entrypoint.py download-to-cache` (same image, same env, so it
        # resolves the identical profile/model the main container will
        # select) before the main container starts, into the shared
        # ephemeral-storage volume. Needed for engines whose model-cache
        # resolution requires the model already on disk rather than
        # downloading it themselves at launch (e.g. llamacpp — see
        # src/aim_runtime/engines/llamacpp.py's resolve_model_path). Set
        # AIM_CACHE_PATH (in env_vars) to a path under /workload so the
        # download lands on this same mounted volume, not the container's
        # own writable layer.
        - name: model-cache-init
          image: {{ .Values.image | quote }}
          command: ["./entrypoint.py", "download-to-cache"]
          {{- if .Values.env_vars }}
          env:
            {{- include "aimchart-llm.container.env" . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "aimchart-llm.container.volumeMounts" . | nindent 12 }}
      {{- end }}
      containers:
        - name: aim-llm
          {{- if .Values.env_vars }}
          env:
            {{- include "aimchart-llm.container.env" . | nindent 12 }}
          {{- end }}
          image: {{ .Values.image | quote }}
          imagePullPolicy: "Always"
          ports:
            - name: http
              containerPort: {{ default 8000 .Values.env_vars.AIM_PORT }}
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            failureThreshold: 360 # 360 x 10s => allow for 60 minutes startup time
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
          resources:
            {{- include "aimchart-llm.container.resources" . | nindent 12 }}
          volumeMounts:
            {{- include "aimchart-llm.container.volumeMounts" . | nindent 12 }}
      volumes:
  {{- include "aimchart-llm.container.volumes" . | nindent 8 }}
{{- end -}}

{{ define "aimchart-llm.deployment.kaiwoservice" -}}
apiVersion: kaiwo.silogen.ai/v1alpha1
kind: KaiwoService
metadata:
  name: {{ include "aimchart-llm.release.fullname" . }}
  labels:
    app: {{ include "aimchart-llm.release.fullname" . }}
    {{- range $key, $value := .Values.metadata.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  deployment:
    {{- include "aimchart-llm.deployment.bare" . | nindent 4 }}
{{- end }}

{{- $pv := include "aimchart-llm.platformValues" . | fromYaml -}}
{{- $ctx := merge (dict "Values" $pv) (omit . "Values") -}}
{{- with $ctx -}}

{{ if not .Values.existingService -}}
{{- if .Values.kaiwo.enabled -}}
{{- include "aimchart-llm.deployment.kaiwoservice" . }}
{{- else -}}
{{- include "aimchart-llm.deployment.bare" . }}
{{- end }}
{{- end }}

{{- end -}}
