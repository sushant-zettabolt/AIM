# Overrides for deploying our llama.cpp-backed AIM image instead of this
# chart's default vLLM-based epyc image. Turns on aimchart-llm's
# modelCacheInit (vendored template addition — see
# aimchart-llm/templates/deployment.yml) because, unlike vLLM, this engine's
# resolve_model_path requires the model already pre-staged in AIM's cache
# dir (src/aim_runtime/engines/llamacpp.py) rather than downloading it
# itself at launch.
#
# Usage:
#   helm dependency build .
#   helm template <release-name> . \
#     -f values.yaml -f values.epyc-llamacpp.yaml \
#     | kubectl apply -f - -n <namespace>

global:
  platform: epyc

# OpenWebUI's own storage. Upstream default storageClassName (mlstorage)
# doesn't exist on this cluster. `local-path` is Rancher's local-path-provisioner
# StorageClass — install it once per cluster (see command.md's cluster
# bring-up sequence) and it dynamically provisions a hostPath-backed PV per
# PVC on whichever node the pod lands on. With a real StorageClass set,
# templates/pvc.yaml creates a real named PVC (survives pod
# replacement/rollout, not just container restarts) instead of the
# emptyDir fallback (templates/_helpers.tpl's container.volumes).
storage:
  ephemeral:
    storageClassName: local-path

llm:
  # Built via the real 3-layer pattern: assets/epyc/engines/llamacpp/image/Dockerfile
  # (Layer 1: llama-server, generic CPU build) -> docker/Dockerfile.aim-epyc-base
  # (Layer 2, built against assets/epyc/base/llamacpp/) -> docker/Dockerfile.aim
  # (Layer 3, assets/epyc/aim-smoketest/llamacpp-tiny/). All three layers
  # pushed public to Docker Hub -- Layer 3 built by actually pulling Layer 2
  # from the registry (not a local tag), which in turn pulled Layer 1 from
  # the registry, matching how the real vLLM pattern's layers are genuinely
  # separate, independently-pullable images. Canonical name per
  # get_model_image_name('epyc', 'aim-smoketest-llamacpp-tiny', 'llamacpp')
  # in src/aim_utils/image_naming.py.
  image: "docker.io/stpauljackson3/aim-epyc-target-llamacpp-model-aim-smoketest-llamacpp-tiny:0.3.0"

  gpus: 0
  # Tiny 0.5B model (see the profile's engine_args) -- deliberately light vs.
  # the 10-core reservation used for the earlier vLLM/8B-class smoke test.
  # Keep threads (profile's engine_args.threads, currently 4) in sync with
  # this if you change it -- llama-server doesn't see the cgroup quota on
  # its own.
  cpus: 4
  memory: 4

  # Same local-path StorageClass as the top-level storage block above — see
  # that comment. This one matters more than OpenWebUI's: without a real
  # PVC here, the model the init container downloads (below) is gone on the
  # next pod replacement and re-downloads from HF, same as before.
  storage:
    ephemeral:
      storageClassName: local-path

  # llamacpp requires the model pre-staged before serve() runs.
  # modelCacheInit runs `./entrypoint.py download-to-cache` in an init
  # container, same image/env, so it resolves the identical profile; it
  # needs AIM_CACHE_PATH (below) to land on the same /workload-mounted
  # volume the main container reads from, not the init container's own
  # writable layer (which the main container never sees).
  modelCacheInit:
    enabled: true

  env_vars:
    # Under /workload (the shared ephemeral-storage mount — see
    # aimchart-llm.container.volumeMounts) so the init container's download
    # and the main container's ModelCacheResolver read agree on where the
    # model lives. Default (config.py's DEFAULT_CACHE_PATH) is
    # /workspace/model-cache, which isn't on any mounted volume here.
    AIM_CACHE_PATH: "/workload/model-cache"
    # platformDefaults.epyc.env_vars (aimchart-llm's own values.yaml) sets
    # AIM_PRECISION: "bf16" for the vLLM default image -- env_vars deep-merges
    # (mergeOverwrite in aimchart-llm's _main.tpl), so it survives into this
    # override unless explicitly overwritten here. Left as bf16, it would fail
    # profile_selector.py's precision-compatibility check (:464-469) against
    # our profile's precision: int8 and the deployment would never come up.
    AIM_PRECISION: "int8"
    # Required, not optional: AIM_ENGINE defaults to "vllm" independently of
    # which profile ends up selected (src/aim_runtime/config.py:337) -- the
    # profile's own metadata.engine: llamacpp does NOT get picked up
    # automatically. Without this the container fails startup with
    # "No configuration for engine 'vllm' in .../engines.yaml" even though
    # AIM_ID correctly resolved the one llamacpp profile that exists.
    # Confirmed by local docker-run reproduction before this was added.
    AIM_ENGINE: "llamacpp"
  # AIM_ID is already baked into the image by docker/Dockerfile.aim (ORG/MODEL
  # build args); combined with AIM_ENGINE above, no AIM_ENGINE_ARGS override
  # is needed unless you want to change ctx-size/threads without rebuilding
  # the image, e.g.:
  # env_vars:
  #   AIM_ENGINE_ARGS: '{"ctx-size": 4096, "threads": 2}'
