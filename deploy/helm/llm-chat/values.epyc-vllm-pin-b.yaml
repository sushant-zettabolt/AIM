# vLLM core-pinning experiment, instance B -- see values.epyc-vllm-pin-a.yaml.
# Pins to node 1's physical cores 96-103, the mirror-image socket, so
# instances A and B never share a NUMA node.
#
#   helm template llm-vllm-pinned-b . -f values.yaml -f values.epyc-vllm.yaml \
#     -f values.epyc-vllm-pin-b.yaml | kubectl apply -f - -n aim-demo-standalone
llm:
  fullnameOverride: llm-vllm-pinned-b
  cpuAffinity: "96-103"
  # See values.epyc-vllm-10instances.yaml's comment on CPU_VISIBLE_MEMORY_NODES.
  env_vars:
    CPU_VISIBLE_MEMORY_NODES: "1"
  metadata:
    labels:
      pin-group: "llm-vllm-pinned"
